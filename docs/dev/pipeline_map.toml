# pg_gpu pipeline map
#
# Every input format, matrix type, dispatch path and analysis endpoint in
# pg_gpu, with the axes that a change must cover. Read it before you add a
# statistic, change a rule (span, missing data, undefined values, window
# grid), or change one code path of a statistic that has parallel paths.
#
# How to use it:
#   1. Find your function or statistic: grep for `"diversity.pi"` or
#      `[windowed.pi]`.
#   2. Read its `parallel` list (functions) or `engines` list (windowed).
#      Each entry is an implementation that must change in step with yours.
#   3. Go through [axes] and [checklists]. For each axis, decide what your
#      change does on each value, and test each value.
#
# tests/test_pipeline_map.py checks the map against the code. It fails when
# the code and the map do not agree on:
#   - the modules of the package ([meta]),
#   - the public functions of each inventory module and their axis keywords,
#   - the loaders and their parameters ([inputs]),
#   - the public methods of each matrix class ([matrices]),
#   - which engine computes each windowed statistic ([windowed], [engines]),
#   - any dotted name that starts with a module or a matrix class, in any
#     field: each must resolve in the code.
# The test does not check the rest of the free text (`inputs`, `streaming`,
# `missing_data`, `span`, `span_normalized`, `undefined`, `notes` and the
# descriptions). Keep it true when you change the code.
#
# Names: "module.function" is relative to the pg_gpu package, and
# "Class.method" names a method of a class in [matrices]. Write a code path
# in this dotted form, so that the test can check it.

[meta]
# Modules with one [functions] row for each public function.
inventory_modules = [
    "diversity", "divergence", "sfs", "selection", "ld_statistics",
    "ld_statistics_genotype", "admixture", "decomposition", "distance_stats",
    "relatedness", "resampling", "moments_ld", "ld_pipeline", "accessible",
    "plotting", "windowed_analysis",
]
# Keywords that put a function on an axis. A function row's `axis_kwargs`
# lists the ones in its signature.
axis_kwargs = [
    "missing_data",
    "population", "populations", "pop1", "pop2", "pop_a", "pop_b", "pop_c", "pop_d",
    "span_normalize", "per_base", "is_accessible", "accessible_bed",
    "window_size", "step_size", "bp_bins", "window_type", "regions",
]

# Every other module, with its role.
[meta.other_modules]
__init__ = "Package exports and the import-time CUDA check. It exports the function windowed_analysis under the module's name, so `import pg_gpu.windowed_analysis as w` gives the function; use importlib.import_module."
haplotype_matrix = "HaplotypeMatrix and its loaders; haplotype_matrix._decide_streaming_mode chooses eager or streaming for from_zarr."
genotype_matrix = "GenotypeMatrix and its loaders. It repeats the span bookkeeping of HaplotypeMatrix (n_total_sites from the mask) but has no get_span."
streaming_matrix = "StreamingHaplotypeMatrix and StreamingGenotypeMatrix: chunk iteration over a VCZ store, with chunk fetchers (host thread or kvikio)."
zarr_source = "ZarrGenotypeSource: lazy region, chunk and sample-subset reads of a VCZ store."
zarr_io = "VCZ (bio2zarr) and scikit-allel zarr layouts: format detection, reads and writes."
_gpu_genotype_prep = "Builds HaplotypeMatrix and GenotypeMatrix arrays on the GPU from raw VCZ genotype blocks; the streaming chunks use it."
_haplotype_groups = "Haplotype frequencies in windows with missing calls (maximum likelihood); Garud H and haplotype_count use it."
_haplotype_hash = "Exact haplotype hashing; garud_h_windows is the one Garud H and haplotype_count implementation for the scalar and windowed paths."
_memutil = "Chunking helpers that bound GPU memory over variants."
_utils = "Shared helpers; population_rows resolves a population name or row list to a row subset."
_warnings = "Warning classes and the load-time checks that emit them."
genotype_kernels = "CUDA kernels for genotype (diploid) LD statistics: DD, Dz, pi2."
haplotype_kernels = "CUDA kernels for haplotype LD statistics: DD, Dz, pi2."

# ---------------------------------------------------------------------------
# Axes: the dimensions that a feature or a fix must cover.
# ---------------------------------------------------------------------------

[axes.input]
description = "How data enters pg_gpu. Each loader sets a different span source and a different set of metadata (sample names, fields, sample_sets)."
values = ["VCF (from_vcf)", "VCZ zarr (from_zarr)", "scikit-allel zarr (from_zarr)", "tskit TreeSequence (from_ts)", "numpy or cupy arrays (constructor)", "streaming VCZ (from_zarr, streaming='always' or 'auto')"]
see = "[inputs]"

[axes.matrix]
description = "The object that a statistic receives. Many functions accept only HaplotypeMatrix; check `inputs` in the function row."
values = ["HaplotypeMatrix", "GenotypeMatrix", "StreamingHaplotypeMatrix", "StreamingGenotypeMatrix", "array"]
see = "[matrices]"

[axes.missing_data]
description = "'include' uses each site with the calls it has; 'exclude' keeps only sites with no missing call in the rows the statistic reads. A few functions accept other values (for example 'scale' in distance_stats)."
values = ["include", "exclude"]
check = "Each engine applies 'exclude' on its own: windowed_analysis._apply_exclude (fused), the scatter engines, windowed_analysis.StatisticsComputer._n_sites (fallback), and each scalar function."

[axes.span]
description = "The per-base denominator. HaplotypeMatrix.get_span('auto') uses the accessible-mask count, then n_total_sites, then chrom_end - chrom_start + 1 (both bounds are inclusive)."
values = ["accessible mask", "n_total_sites", "region length", "raw (span_normalize=False)"]
check = "Scalar: HaplotypeMatrix.get_span. Fused engines: windowed_analysis._compute_window_bases (mask, else window length). Scatter engines: inline code in windowed_analysis._windowed_thetas_scatter and windowed_analysis._windowed_twopop_scatter (mask, else a share of n_total_sites, else window length). Fallback: the scalar function on the window matrix. Streaming: streaming_matrix._StreamingMatrixBase.get_span."

[axes.population]
description = "Which rows a statistic reads. A population is a name in sample_sets or a list of row indices; _utils.population_rows resolves both."
values = ["none (all rows)", "name in sample_sets", "list of rows", "two populations (pop1, pop2)", "three or more (admixture, pairwise loops)"]
check = "Names and row lists must give the same values. Two-population windowed statistics name the column after the statistic only when exactly two populations are given."

[axes.windowing]
description = "How windows are formed. windowed_analysis picks one engine per request; see [engines]. Other functions make their own windows."
values = ["bp windows (window_size, step_size)", "snp windows (window_type='snp'; the fallback and local_pca only)", "regions (window_type='regions' with a regions DataFrame of half-open [start, end) windows; the fused engines and the fallback; theta_l, zeng_e, zeng_dh, normalized_fay_wu_h, mean_nsl, daf_hist and mu_sfs raise NotImplementedError)", "bp_bins edges (windowed_statistics_fused*, LD bins)", "moving windows in variant counts (moving_*)"]
check = "windowed_analysis._bp_window_grid makes the bp grid for the scatter and fused engines; for window_type='regions' the fused engines take regions['start'] and regions['end'] as window edges; windowed_analysis.WindowIterator makes the fallback windows. The fused engines give a row for an empty region, but the fallback gives none (#356). No engine reads a chrom column in regions to select variants; the fallback copies it into the output chrom column, and the fused engines write the chrom argument."

[axes.streaming]
description = "A StreamingHaplotypeMatrix has no .haplotypes array. A function runs on it chunk by chunk (native), rejects it with a pointed error, or fails with the generic NotImplementedError of the .haplotypes property."
values = ["native", "rejects", "generic_error"]
check = "windowed_analysis runs each chunk through the eager dispatcher, so a windowed statistic streams when its eager engine works on one chunk. Statistics that integrate across variants (mean_nsl) are cut at chunk edges."

[axes.undefined]
description = "What a statistic returns when it has no value, for example too few haplotypes, no site, or no accessible base."
values = ["NaN", "0.0 or another fixed value", "raises"]
check = "The scalar function, each windowed engine and the fallback must agree. A consumer (pcoa, plotting, resampling) must handle the NaN that its producer can emit."

[axes.alleles]
description = "Biallelic and multiallelic sites. Allele codes are 0..k, and -1 is missing."
values = ["biallelic", "multiallelic"]
check = "The fused engines drop sites above an allele cap (windowed_analysis._filter_fused_allele_cap_raw, MultiallelicCapWarning). Some functions call HaplotypeMatrix.restrict_to_biallelic."

# ---------------------------------------------------------------------------
# Inputs: every loader. `params` is checked against the signature.
# ---------------------------------------------------------------------------

[inputs."HaplotypeMatrix.__init__"]
params = ["genotypes", "positions", "chrom_start", "chrom_end", "sample_sets", "n_total_sites", "samples", "accessible_mask", "fields", "allow_empty"]
returns = "HaplotypeMatrix"
span = "n_total_sites and accessible_mask as given; a mask with no n_total_sites sets n_total_sites to the accessible bases in [chrom_start, chrom_end]."

[inputs."HaplotypeMatrix.from_vcf"]
params = ["path", "region", "samples", "include_invariant", "accessible_bed", "fields"]
returns = "HaplotypeMatrix"
span = "include_invariant=True sets n_total_sites to the record count. accessible_bed sets the mask and n_total_sites."
notes = "region is samtools style with an inclusive end; chrom_start and chrom_end come from the region, else from the first and last variant."

[inputs."HaplotypeMatrix.from_zarr"]
params = ["path", "region", "accessible_bed", "pop_assignment", "streaming", "chunk_bp", "prefetch", "backend", "fields"]
returns = "HaplotypeMatrix, or StreamingHaplotypeMatrix when streaming='always', or 'auto' and the matrix does not fit"
span = "accessible_bed only; there is no include_invariant, so n_total_sites stays None."
notes = "Reads VCZ and scikit-allel layouts (zarr_io). The streaming path rejects fields=."

[inputs."HaplotypeMatrix.from_ts"]
params = ["ts", "device", "include_invariant", "accessible_bed", "chrom"]
returns = "HaplotypeMatrix"
span = "include_invariant=True sets n_total_sites to the sequence length. accessible_bed sets the mask."

[inputs."GenotypeMatrix.__init__"]
params = ["genotypes", "positions", "chrom_start", "chrom_end", "sample_sets", "n_total_sites", "samples", "accessible_mask", "fields", "allow_empty"]
returns = "GenotypeMatrix"
span = "Same rule as HaplotypeMatrix.__init__, in its own code."

[inputs."GenotypeMatrix.from_vcf"]
params = ["path", "include_invariant", "accessible_bed", "fields"]
returns = "GenotypeMatrix"
span = "include_invariant=True sets n_total_sites to the record count. accessible_bed sets the mask."
notes = "No region and no samples parameter, unlike HaplotypeMatrix.from_vcf."

[inputs."GenotypeMatrix.from_zarr"]
params = ["path", "region", "accessible_bed", "include_invariant", "pop_assignment", "streaming", "chunk_bp", "prefetch", "backend", "fields"]
returns = "GenotypeMatrix, or StreamingGenotypeMatrix on the streaming path"
span = "include_invariant=True sets n_total_sites to the variant count on the eager path only; the streaming path ignores it. accessible_bed sets the mask on both paths."

[inputs."GenotypeMatrix.from_haplotype_matrix"]
params = ["hap_matrix"]
returns = "GenotypeMatrix"
span = "Copies n_total_sites and accessible_mask."
notes = "Pairs haplotype rows 2i and 2i+1 into individual i."

# ---------------------------------------------------------------------------
# Matrices: the public methods and properties of each class (checked).
# ---------------------------------------------------------------------------

[matrices.HaplotypeMatrix]
module = "haplotype_matrix"
methods = [
    "Tajimas_D", "accessible_mask", "compute_ld_statistics_gpu_single_pop",
    "compute_ld_statistics_gpu_two_pops", "count_called", "count_missing",
    "device", "diversity", "exclude_missing_sites", "filter",
    "filter_variants_by_missing", "from_ts", "from_vcf", "from_zarr",
    "get_matrix", "get_positions", "get_span", "get_subset",
    "get_subset_from_range", "haplotypes", "has_accessible_mask",
    "has_invariant_info", "is_called", "is_missing", "load_pop_file",
    "locate_unlinked", "n_callable_sites", "n_invariant_sites",
    "n_segregating_sites", "num_haplotypes", "num_variants", "pairwise_LD_v",
    "pairwise_r2", "positions", "remove_accessible_mask",
    "restrict_to_biallelic", "restrict_to_segregating", "sample_sets",
    "set_accessible_mask", "shape", "summarize_missing_data",
    "tally_gpu_haplotypes", "tally_gpu_haplotypes_two_pops",
    "tally_gpu_haplotypes_two_pops_with_missing", "to_zarr", "transfer_to_cpu",
    "transfer_to_gpu", "vcf_to_zarr", "watersons_theta", "windowed_r_squared",
]
notes = "get_span is the scalar span rule. Subsets (get_subset, get_subset_from_range, population_rows) keep n_total_sites; a range subset recounts it from the mask."

[matrices.GenotypeMatrix]
module = "genotype_matrix"
methods = [
    "accessible_mask", "device", "filter", "from_haplotype_matrix", "from_vcf",
    "from_zarr", "genotypes", "has_accessible_mask", "has_invariant_info",
    "load_pop_file", "n_callable_sites", "n_invariant_sites",
    "n_segregating_sites", "num_individuals", "num_variants", "positions",
    "remove_accessible_mask", "restrict_to_segregating", "sample_sets",
    "set_accessible_mask", "shape", "to_haplotype_matrix", "to_zarr",
    "transfer_to_cpu", "transfer_to_gpu",
]
notes = "No get_span, no from_ts, no get_subset; a statistic that needs these on genotypes converts or carries its own code."

[matrices.StreamingHaplotypeMatrix]
module = "streaming_matrix"
methods = [
    "chrom", "chrom_end", "chrom_start", "chunk_bp",
    "compute_ld_statistics_gpu_single_pop", "compute_ld_statistics_gpu_two_pops",
    "get_span", "haplotypes", "iter_gpu_chunks", "materialize",
    "num_haplotypes", "num_variants", "sample_sets",
]
notes = "accessible_mask and n_total_sites are instance attributes: the loader sets accessible_mask from accessible_bed and leaves n_total_sites None. .haplotypes raises. iter_gpu_chunks yields closed chunks [s, s + chunk_bp - 1] as eager HaplotypeMatrix objects; materialize(region=) gives an eager sub-region."

[matrices.StreamingGenotypeMatrix]
module = "streaming_matrix"
methods = [
    "chrom", "chrom_end", "chrom_start", "chunk_bp",
    "genotypes", "get_span", "iter_gpu_chunks", "materialize",
    "num_individuals", "num_variants", "sample_sets",
]
notes = ".genotypes raises. Chunks are eager GenotypeMatrix objects."

# ---------------------------------------------------------------------------
# Windowed engines: the implementations that windowed_analysis dispatches to.
# `stats` names the set of statistics that the engine computes, as the code
# holds it. The test resolves it (and calls it when it is a function) and
# compares it with the `engines` list of each [windowed] row. The streaming
# engine runs the other engines on each chunk, so it has no set of its own.
# ---------------------------------------------------------------------------

[engines.thetas_scatter]
function = "windowed_analysis._windowed_thetas_scatter"
stats = "windowed_analysis._SCATTER_SINGLE_STATS"
chosen = "window_type='bp', every requested name is in its set and at most one population is given. A mixed request of these and two-population names with two populations runs both scatter engines and joins the columns."
span = "Inline: the accessible mask, else a share of n_total_sites in proportion to the window length, else the window length."
missing_data = ["include", "exclude"]

[engines.twopop_scatter]
function = "windowed_analysis._windowed_twopop_scatter"
stats = "windowed_analysis._TWO_POP_STATS"
chosen = "window_type='bp', every requested name is a two-population statistic and exactly two populations are given."
span = "Inline, the same rule as thetas_scatter, in its own code."
missing_data = ["include", "exclude"]

[engines.fused]
function = "windowed_analysis.windowed_statistics_fused"
stats = "windowed_analysis._FUSED_STATS"
chosen = "No scatter engine takes the request, window_type is 'bp' or 'regions' (for regions, mean_nsl, daf_hist and mu_sfs raise NotImplementedError), every name is in its set, two-population names come with exactly two populations, and missing_data='include'. Under 'exclude' it runs only for a Garud-only request or a request with a name that the fallback does not know."
span = "windowed_analysis._compute_window_bases: the accessible mask, else the window length. It does not read n_total_sites."
missing_data = ["include", "exclude"]

[engines.fused_chunked]
function = "windowed_analysis.windowed_statistics_fused_chunked"
stats = "windowed_analysis._CHUNKED_OWN_STATS"
chosen = "The fused engine is chosen and its transposed int8 copy would not fit in 70 percent of free GPU memory. It computes its own statistics again in chunks and hands every other fused statistic to windowed_statistics_fused."
span = "windowed_analysis._compute_window_bases."
missing_data = ["include", "exclude"]

[engines.fallback]
function = "windowed_analysis.StatisticsComputer.compute"
stats = "windowed_analysis._fallback_stats"
chosen = "No other engine takes the request. It is the only engine for window_type='snp', where a name it does not know raises NotImplementedError. It also accepts callables as custom statistics."
span = "The scalar function on each window matrix. windowed_analysis.WindowIterator slices it with get_subset, which keeps the parent's n_total_sites; with a mask, windowed_analysis.WindowIterator._attach_window_mask sets the window's accessible count. So with n_total_sites and no mask, each window divides by the n_total_sites of the whole region."
missing_data = ["include", "exclude"]
notes = "A window with no variant gives NaN for every statistic. A request whose names no single engine covers (for example theta_l with zns) reaches this engine and fails with 'Unknown statistic'."

[engines.local_pca]
function = "decomposition.local_pca"
stats = "windowed_analysis._LOCAL_PCA_STATS"
chosen = "A requested name is local_pca or local_pca_jackknife. It returns a LocalPCAResult; the other names run through the dispatcher and join .windows."
span = "none"
missing_data = ["include", "exclude"]

[engines.streaming]
function = "windowed_analysis._stream_windowed_analysis"
chosen = "The input is a StreamingHaplotypeMatrix. Each chunk runs through the eager dispatcher, so each chunk picks its own engine."
span = "The chunk matrix; a BED mask is parsed once and shared by all chunks."
missing_data = ["include", "exclude"]
notes = "Rejects step_size != window_size and a window_size that does not divide chunk_bp. mean_nsl is cut at chunk edges."

# ---------------------------------------------------------------------------
# Windowed statistics: every name that windowed_analysis accepts.
# `engines` is checked. `scalar` (checked to resolve) is the function that
# should give the same value on one window; "" means none exists.
# ---------------------------------------------------------------------------

[windowed.pi]
scalar = "diversity.pi"
engines = ["thetas_scatter", "fused", "fused_chunked", "fallback"]
span_normalized = true

[windowed.theta_w]
scalar = "diversity.theta_w"
engines = ["thetas_scatter", "fused", "fused_chunked", "fallback"]
span_normalized = true

[windowed.tajimas_d]
scalar = "diversity.tajimas_d"
engines = ["thetas_scatter", "fused", "fused_chunked", "fallback"]
span_normalized = false

[windowed.segregating_sites]
scalar = "diversity.segregating_sites"
engines = ["thetas_scatter", "fused", "fused_chunked", "fallback"]
span_normalized = false

[windowed.singletons]
scalar = "diversity.singleton_count"
engines = ["thetas_scatter", "fused", "fused_chunked"]
span_normalized = false
notes = "The fallback calls the same count n_singletons."

[windowed.n_singletons]
scalar = "diversity.singleton_count"
engines = ["fallback"]
span_normalized = false
notes = "The scatter and fused engines call it singletons."

[windowed.n_variants]
scalar = ""
engines = ["fallback"]
span_normalized = false
notes = "Also a prefix column of every engine; under 'exclude' it counts the complete sites."

[windowed.theta_h]
scalar = "diversity.theta_h"
engines = ["thetas_scatter", "fused", "fused_chunked"]
span_normalized = true

[windowed.theta_l]
scalar = "diversity.theta_l"
engines = ["thetas_scatter"]
span_normalized = true

[windowed.fay_wu_h]
scalar = "diversity.fay_wus_h"
engines = ["thetas_scatter", "fused", "fused_chunked"]
span_normalized = true

[windowed.normalized_fay_wu_h]
scalar = "diversity.normalized_fay_wus_h"
engines = ["thetas_scatter"]
span_normalized = false

[windowed.zeng_e]
scalar = "diversity.zeng_e"
engines = ["thetas_scatter"]
span_normalized = false

[windowed.zeng_dh]
scalar = "diversity.zeng_dh"
engines = ["thetas_scatter"]
span_normalized = true
notes = "The scatter engine combines Tajima's D with H divided by the window span; diversity.zeng_dh uses the raw H."

[windowed.max_daf]
scalar = "diversity.max_daf"
engines = ["thetas_scatter", "fused", "fused_chunked"]
span_normalized = false

[windowed.het_expected]
scalar = "diversity.heterozygosity_expected"
engines = ["fused", "fallback"]
span_normalized = false
notes = "Per-window mean of per-site expected heterozygosity over the sites with a defined value (n_valid >= 2), NaN for a window with none; not span-normalized. Both engines reuse the per-site rule of diversity.heterozygosity_expected (its CuPy core diversity._heterozygosity_expected_sites) so it lives in one place: the fused engine takes each window's variant range [win_start, win_stop) and prefix-sums the non-NaN values and their count, which serves any window family including unordered or overlapping regions (unlike the site_win path mean_nsl uses); the chunked engine forwards the name to the fused engine; the fallback averages diversity.heterozygosity_expected over each window matrix. Under 'exclude' it is not a fused-only name, so the request falls to the fallback."

[windowed.daf_hist]
scalar = "diversity.daf_histogram"
engines = ["fused"]
span_normalized = false
notes = "Gives the columns daf_bin_0 .. daf_bin_19 (windowed_analysis.N_DAF_BINS)."

[windowed.mu_sfs]
scalar = "diversity.mu_sfs"
engines = ["fused"]
span_normalized = false

[windowed.mu_var]
scalar = "diversity.mu_var"
engines = ["fused"]
span_normalized = true

[windowed.dxy]
scalar = "divergence.dxy"
engines = ["twopop_scatter", "fused", "fused_chunked", "fallback"]
span_normalized = true

[windowed.da]
scalar = "divergence.da"
engines = ["twopop_scatter", "fused", "fused_chunked", "fallback"]
span_normalized = true

[windowed.fst]
scalar = "divergence.fst"
engines = ["twopop_scatter", "fused", "fused_chunked", "fallback"]
span_normalized = false
notes = "Hudson FST in every engine; the same values as fst_hudson."

[windowed.fst_hudson]
scalar = "divergence.fst_hudson"
engines = ["twopop_scatter", "fused", "fused_chunked", "fallback"]
span_normalized = false

[windowed.fst_wc]
scalar = "divergence.fst_weir_cockerham"
engines = ["twopop_scatter", "fused", "fused_chunked", "fallback"]
span_normalized = false

[windowed.garud_h1]
scalar = "selection.garud_h"
engines = ["fused", "fallback"]
span_normalized = false
notes = "Every Garud name and haplotype_count come from _haplotype_hash.garud_h_windows on every path, and add n_complete_haplotypes columns."

[windowed.garud_h12]
scalar = "selection.garud_h"
engines = ["fused", "fallback"]
span_normalized = false

[windowed.garud_h123]
scalar = "selection.garud_h"
engines = ["fused", "fallback"]
span_normalized = false

[windowed.garud_h2h1]
scalar = "selection.garud_h"
engines = ["fused", "fallback"]
span_normalized = false

[windowed.haplotype_count]
scalar = "diversity.haplotype_count"
engines = ["fused", "fallback"]
span_normalized = false

[windowed.mean_nsl]
scalar = "selection.nsl"
engines = ["fused"]
span_normalized = false
notes = "nSL is computed over the whole matrix, then averaged per window; on the streaming path it is cut at chunk edges."

[windowed.zns]
scalar = "ld_statistics.zns"
engines = ["fused"]
span_normalized = false

[windowed.omega]
scalar = "ld_statistics.omega"
engines = ["fused"]
span_normalized = false

[windowed.mu_ld]
scalar = "ld_statistics.mu_ld"
engines = ["fused"]
span_normalized = false

[windowed.dist_var]
scalar = "distance_stats.dist_var"
engines = ["fused"]
span_normalized = false

[windowed.dist_skew]
scalar = "distance_stats.dist_skew"
engines = ["fused"]
span_normalized = false

[windowed.dist_kurt]
scalar = "distance_stats.dist_kurt"
engines = ["fused"]
span_normalized = false

[windowed.snp_dist_mean]
scalar = ""
engines = ["fused"]
span_normalized = false
notes = "The snp_dist names exist only in the fused engine: the distances between adjacent variants in the window."

[windowed.snp_dist_var]
scalar = ""
engines = ["fused"]
span_normalized = false

[windowed.snp_dist_min]
scalar = ""
engines = ["fused"]
span_normalized = false

[windowed.snp_dist_max]
scalar = ""
engines = ["fused"]
span_normalized = false

[windowed.ld_decay]
scalar = "HaplotypeMatrix.pairwise_r2"
engines = ["fallback"]
span_normalized = false
notes = "Needs custom_stat_kwargs={'ld_decay': {'max_distance': ...}}; without it the call raises TypeError."

[windowed.mean_r2]
scalar = "HaplotypeMatrix.pairwise_r2"
engines = ["fallback"]
span_normalized = false
notes = "Needs custom_stat_kwargs={'mean_r2': {'max_dist': ...}}; without it the call raises TypeError."

