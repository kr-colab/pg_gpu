# ---------------------------------------------------------------------------
# Checklists: when you change X, also check Y.
# ---------------------------------------------------------------------------

[checklists]
new_windowed_statistic = [
    "Add the name to the set of each engine that computes it (windowed_analysis module constants, windowed_analysis.StatisticsComputer for the fallback).",
    "Add a [windowed] row here and run tests/test_pipeline_map.py.",
    "Test it alone, together with a name from each other engine family, with two populations, under 'include' and 'exclude', with and without a mask, and on a StreamingHaplotypeMatrix.",
    "Compare each engine with the scalar function on one window.",
]
span_rule = [
    "HaplotypeMatrix.get_span and streaming_matrix._StreamingMatrixBase.get_span.",
    "windowed_analysis._compute_window_bases (fused, fused_chunked).",
    "The inline spans in windowed_analysis._windowed_thetas_scatter and windowed_analysis._windowed_twopop_scatter.",
    "GenotypeMatrix, which has its own n_total_sites code and no get_span.",
    "Every function row with span other than \"none\".",
]
missing_data_rule = [
    "windowed_analysis._apply_exclude (fused), the 'exclude' code of each scatter engine, windowed_analysis.StatisticsComputer._n_sites (fallback).",
    "Every function row whose missing_data list holds the mode, and the GenotypeMatrix branch of each.",
]
undefined_value_rule = [
    "The scalar function, each engine in its [windowed] row, and the fallback rule (NaN for a window with no variant).",
    "The consumers: decomposition.pcoa, the plotting functions, resampling.",
]
window_grid = [
    "windowed_analysis._bp_window_grid (scatter and fused) and windowed_analysis.WindowIterator (fallback).",
    "The streaming chunk edges (StreamingHaplotypeMatrix.iter_gpu_chunks) and the rule that window_size divides chunk_bp.",
    "The moving_* functions and local_pca, which make their own windows.",
]
new_loader_or_input = [
    "Set chrom_start and chrom_end as inclusive bounds, n_total_sites, the mask, sample_sets and samples the way the other loaders do.",
    "Add an [inputs] row, and give both HaplotypeMatrix and GenotypeMatrix the loader or note why not.",
]
new_scalar_statistic = [
    "Decide each axis: inputs, streaming, missing_data, span, population, undefined, alleles.",
    "Add a [functions] row; the test fails until you do.",
]

# ---------------------------------------------------------------------------
# Functions: one row for each public function of each inventory module.
# `axis_kwargs` and `parallel` are checked; the other fields are not.
# ---------------------------------------------------------------------------

[functions."windowed_analysis.windowed_analysis"]
# signature: (haplotype_matrix, window_size, step_size, statistics, populations, missing_data, span_normalize, accessible_bed, chrom, min_complete_haplotypes, window_type, kwargs)
axis_kwargs = ["missing_data", "populations", "span_normalize", "accessible_bed", "window_size", "step_size", "window_type"]
inputs = ["HaplotypeMatrix", "StreamingHaplotypeMatrix"]
streaming = "native"
missing_data = ["include", "exclude"]
span = "per engine; see [engines]"
undefined = "per statistic and engine; the scatter and fused engines give a row for a window with no variant, the fallback gives no row"
parallel = []
notes = "The dispatcher. It picks one engine per request ([engines]); the streaming path runs it once per chunk. It raises TypeError for a keyword argument that no engine reads (windowed_analysis._check_windowed_kwargs), ValueError for an unknown window_type or missing_data, for regions without window_type='regions' and the reverse, and NotImplementedError for window_type 'snp' or 'regions' on a StreamingHaplotypeMatrix and for names that no engine computes on those window types."

[functions."windowed_analysis.windowed_statistics_fused"]
# signature: (haplotype_matrix, bp_bins, statistics, population, pop1, pop2, per_base, is_accessible, _win_starts, _win_stops, missing_data, chrom)
axis_kwargs = ["missing_data", "population", "pop1", "pop2", "per_base", "is_accessible", "bp_bins"]
inputs = ["HaplotypeMatrix"]
streaming = "generic_error"
missing_data = ["include", "exclude"]
span = "windowed_analysis._compute_window_bases"
undefined = "per statistic"
parallel = ["windowed_analysis.windowed_statistics_fused_chunked"]
notes = "The fused engine ([engines.fused]); public, so it can also be called with bp_bins directly."

[functions."windowed_analysis.windowed_statistics_fused_chunked"]
# signature: (haplotype_matrix, bp_bins, statistics, population, pop1, pop2, per_base, is_accessible, _win_starts, _win_stops, missing_data, chrom)
axis_kwargs = ["missing_data", "population", "pop1", "pop2", "per_base", "is_accessible", "bp_bins"]
inputs = ["HaplotypeMatrix"]
streaming = "generic_error"
missing_data = ["include", "exclude"]
span = "windowed_analysis._compute_window_bases"
undefined = "per statistic"
parallel = ["windowed_analysis.windowed_statistics_fused"]
notes = "The chunked fused engine ([engines.fused_chunked]); it has its own code for its statistics and calls windowed_statistics_fused for every other fused statistic."

[functions."diversity.compute_sigma_ij"]
# signature: (n)
axis_kwargs = []
inputs = ["other"]
streaming = "n/a"
missing_data = []
span = "none"
undefined = "(0, 0) array for n = 1; ZeroDivisionError for n = 0"
parallel = ["diversity._achaz_alpha_beta"]
notes = "Takes an int sample size; _achaz_alpha_beta uses the same Fu (1995) sigma structure without building the matrix, so a change to one must go to the other."

[functions."diversity.project_sfs"]
# signature: (sfs, n_from, n_to)
axis_kwargs = []
inputs = ["array"]
streaming = "n/a"
missing_data = []
span = "none"
undefined = "raises ValueError when n_to > n_from"
parallel = ["sfs._projection_matrix_vec"]
notes = "numpy only (a CuPy sfs raises TypeError); diversity._projection_matrix (exact comb) and sfs._projection_matrix_vec (gammaln) build the same hypergeometric matrix."

[functions."diversity.pi_components"]
# signature: (haplotypes, n_total_sites, n_haplotypes_full)
axis_kwargs = []
inputs = ["array"]
streaming = "n/a"
missing_data = []
span = "none"
undefined = "all zeros when no site has two valid haplotypes"
parallel = ["diversity._ac_contribution", "divergence._site_components_from_counts"]
notes = "CuPy haplotype array only (numpy raises TypeError in allele_counts); sites with n_valid < 2 are left out of diffs and comps."

[functions."diversity.pi"]
# signature: (haplotype_matrix, population, span_normalize, missing_data)
axis_kwargs = ["missing_data", "population", "span_normalize"]
inputs = ["HaplotypeMatrix"]
streaming = "generic_error"
missing_data = ["include", "exclude"]
span = "get_span"
undefined = "0.0 with no variants or fewer than two haplotypes; NaN when span <= 0 with variants present"
parallel = ["diversity.pi_components", "diversity.FrequencySpectrum.theta", "divergence._site_components_from_counts", "windowed_analysis._windowed_thetas_scatter", "windowed_analysis._fused_windowed_kernel_v2", "windowed_analysis.windowed_statistics_fused", "windowed_analysis.windowed_statistics_fused_chunked"]
notes = "The no-variant check runs before the span check, so a mask that removes every variant gives 0.0, not NaN; _fused_windowed_kernel_v2 has its own C copy of the per-site formula."

